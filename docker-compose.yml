version: "3.8"

services:
  perchai-2api:
    build: .
    image: perchai-2api:local
    container_name: perchai-2api
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "8080"
      PERCH_CLI_AUTH_DIR: /data
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
